<IfModule mod_headers.c>
    # 🔓 Permitir carga en iframe desde múltiples dominios válidos
    Header always unset X-Frame-Options
    Header always set Content-Security-Policy "frame-ancestors 'self' https://sugar.102dates.com https://sugar-loc.102dates.com https://custom-loc.102dates.com https://custom-local.102dates.com"

    # 🌎 Configuración flexible de CORS
    SetEnvIf Origin "https://sugar\.102dates\.com$" AccessControlAllowOrigin=$0
    SetEnvIf Origin "https://sugar-loc\.102dates\.com$" AccessControlAllowOrigin=$0
    SetEnvIf Origin "https://custom-loc\.102dates\.com$" AccessControlAllowOrigin=$0
    SetEnvIf Origin "https://custom-local\.102dates\.com$" AccessControlAllowOrigin=$0

    Header always set Access-Control-Allow-Origin "%{AccessControlAllowOrigin}e" env=AccessControlAllowOrigin
    Header always set Access-Control-Allow-Credentials "true" env=AccessControlAllowOrigin
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS" env=AccessControlAllowOrigin
    Header always set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" env=AccessControlAllowOrigin
</IfModule>

<IfModule mod_rewrite.c>
    # 🛡️ Permitir respuestas correctas a peticiones OPTIONS (preflight)
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=204,L]
</IfModule>

# ✅ Opcional: Evitar errores innecesarios por falta de index
DirectoryIndex index.php index.html
